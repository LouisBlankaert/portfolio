server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le portfolio est une "single page application" : le serveur ne connaît
    # qu'un seul fichier HTML, c'est le JavaScript qui affiche la bonne
    # section. Sans cette ligne, ouvrir directement une adresse autre que la
    # racine renverrait une erreur 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers JS/CSS/images portent un identifiant unique dans leur nom
    # (main.2b3f72ae.js) : ils changent de nom à chaque build, donc on peut
    # dire au navigateur de les garder en cache un an sans risque.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, lui, ne doit jamais être mis en cache : c'est lui qui
    # pointe vers la dernière version des fichiers ci-dessus.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
